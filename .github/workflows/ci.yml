name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            targets: --win nsis
          - os: macos-latest
            targets: --mac zip --arm64 --x64
          - os: ubuntu-latest
            targets: --linux deb tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder ${{ matrix.targets }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: winemaker-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.zip
            release/*.dmg
            release/*.deb
            release/*.tar.gz
          if-no-files-found: error

  # На теге v*: перекладываем собранные артефакты в GitHub Release —
  # внутри экосистемы GitHub, без локальных скачиваний.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Attach artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --target main --generate-notes
          gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
