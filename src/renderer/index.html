<!doctype html>
<!-- Язык страницы выставляет bootstrap до первой отрисовки (спека localization). -->
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Winemaker</title>
    <!--
      Strict CSP: скрипты и стили только свои. ws://localhost:* нужен
      только для vite HMR в dev; скрипты с чужих источников не исполняются.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://localhost:*"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
